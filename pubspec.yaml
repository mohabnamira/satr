name: satr
description: "Satr — a calm, private journaling companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  riverpod: ^2.1.3
  uuid: ^4.5.1
  flutter_secure_storage: ^11.2.0
  package_info_plus: 10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/Work_Sans/static/WorkSans-Regular.ttf
        - asset: assets/fonts/Work_Sans/static/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Work_Sans/static/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Work_Sans/static/WorkSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/Noto_Sans_Arabic/static/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/Noto_Sans_Arabic/static/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/Noto_Sans_Arabic/static/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Noto_Sans_Arabic/static/NotoSansArabic-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"      

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  fullscreen: true
  android_12:
    color: "#000000"
    color_dark: "#000000"